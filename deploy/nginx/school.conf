# /etc/nginx/sites-available/school.conf
# Main domain + wildcard branch subdomains served by one Laravel app.
# Replace schooldomain.com with TENANCY_BASE_DOMAIN.

# HTTP → HTTPS (all hosts)
server {
    listen 80;
    listen [::]:80;
    server_name schooldomain.com *.schooldomain.com;
    return 301 https://$host$request_uri;
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.schooldomain.com;
    ssl_certificate     /etc/letsencrypt/live/schooldomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schooldomain.com/privkey.pem;
    return 301 https://schooldomain.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Apex (central) + every branch subdomain. Add branch custom domains here too.
    server_name schooldomain.com *.schooldomain.com;
    root /var/www/school/public;
    index index.php;

    # Wildcard certificate (DNS-01): covers apex + *.schooldomain.com
    ssl_certificate     /etc/letsencrypt/live/schooldomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schooldomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    client_max_body_size 20m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git …)
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/school.access.log;
    error_log  /var/log/nginx/school.error.log;
}
