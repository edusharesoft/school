; /etc/supervisor/conf.d/school-worker.conf
[program:school-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/school/artisan queue:work redis --queue=high,default,notifications,exports --sleep=3 --tries=3 --backoff=30 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/school/storage/logs/worker.log
stopwaitsecs=3600
