# /etc/apache2/sites-available/school.conf  (a2enmod rewrite ssl headers proxy_fcgi setenvif; a2enconf php8.3-fpm)
<VirtualHost *:80>
    ServerName schooldomain.com
    ServerAlias *.schooldomain.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName schooldomain.com
    ServerAlias *.schooldomain.com
    DocumentRoot /var/www/school/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/schooldomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/schooldomain.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    <Directory /var/www/school/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/school-error.log
    CustomLog ${APACHE_LOG_DIR}/school-access.log combined
</VirtualHost>
